<!doctype html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- FAVICON - D -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23866bfc'/%3E%3Cstop offset='100%25' style='stop-color:%234f35c9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23grad)' stroke='white' stroke-width='2.5'/%3E%3Ctext x='50' y='69' font-size='48' text-anchor='middle' fill='white' font-weight='bold' font-family='Arial'%3ED%3C/text%3E%3C/svg%3E"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />

    <link rel="stylesheet" href="./fonts/css/all.css" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Dictionary</title>
  </head>

  <body>
    <!-- AUDIO -->
    <audio id="sound"></audio>

    <!-- ERROR TOAST -->
    <div class="error-toast hide" id="errorToast">
      <i class="fas fa-exclamation-triangle"></i>
      <span id="alert_result"></span>
    </div>

    <main class="container">
      <!-- HEADER -->
      <div class="app-header">
        <div class="brand">
          <div class="brand-icon">D</div>

          <div>
            <h1>Dictionary</h1>
            <p>Explore the meaning of words</p>
          </div>
        </div>

        <button
          class="theme-btn"
          id="theme-btn"
          type="button"
          aria-label="Change theme"
        >
          <i class="fas fa-moon"></i>
        </button>
      </div>

      <!-- SEARCH -->
      <div class="search-box">
        <div class="search-input-wrapper">
          <i class="fas fa-search search-icon"></i>

          <input
            type="text"
            placeholder="Search for a word..."
            id="inp-word"
            autocomplete="off"
            spellcheck="false"
          />

          <button
            class="clear-btn"
            id="clear-btn"
            type="button"
            aria-label="Clear"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>

        <button id="search-btn" type="button">
          <span class="search-text">Search</span>
          <span class="loading-spinner"></span>
        </button>
      </div>

      <!-- RESULT -->
      <div class="result" id="result">
        <!-- Data loaded from JS -->
      </div>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
